name: Refresh contribution trail

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/contributions.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-trail
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions-light.svg?color_snake=#168a9a&color_dots=#e7f0f1,#b7d8dc,#7dbfc7,#469aa7,#246c7e
            dist/contributions-dark.svg?color_snake=#8cdbd3&color_dots=#152b36,#24505e,#327383,#54a5ac,#91d9d0

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
